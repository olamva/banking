name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, types, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/oauth2-proxy.tar.gz" https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.5/oauth2-proxy-v7.15.5.linux-amd64.tar.gz
          echo "f63f94bf72c5f46ab002a0a275aa8b3cf19b4d828aed08a13978cb9a62c3a1fd  $RUNNER_TEMP/oauth2-proxy.tar.gz" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/oauth2-proxy.tar.gz" -C "$RUNNER_TEMP" --strip-components=1
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: pnpm test
      - if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: HEAD^1
          RELEASE_EXEMPT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'no release') }}
        run: pnpm release:check
      - run: pnpm typecheck
      - run: pnpm build
