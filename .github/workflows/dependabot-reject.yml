name: Dependabot rejection

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  reject:
    name: Reject failed update
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          author="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.user.login')"
          [[ "$author" == 'dependabot[bot]' ]] || exit 0
          gh pr close "$PR" --comment 'Required CI failed. This update is closed. Dependabot can replace it in a later update cycle.'
