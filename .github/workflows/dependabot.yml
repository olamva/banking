name: Dependabot

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  GH_REPO: ${{ github.repository }}

jobs:
  review:
    name: Review update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: metadata
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
      - id: files
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')"
          case "$ECOSYSTEM" in
            npm_and_yarn) unexpected="$(printf '%s\n' "$files" | grep -Ev '^(package.json|pnpm-lock.yaml)$' || true)" ;;
            github_actions) unexpected="$(printf '%s\n' "$files" | grep -Ev '^\.github/workflows/[^/]+$' || true)" ;;
            *) unexpected="$files" ;;
          esac
          if [[ -n "$unexpected" ]]; then
            echo 'safe=false' >> "$GITHUB_OUTPUT"
          else
            echo 'safe=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Enable merge after checks pass
        if: github.event.pull_request.user.login == 'dependabot[bot]' && steps.files.outputs.safe == 'true' && steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --merge
      - name: Request owner input
        if: github.event.pull_request.user.login == 'dependabot[bot]' && (steps.files.outputs.safe != 'true' || steps.metadata.outputs.update-type == 'version-update:semver-major')
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create needs-owner-input --color D93F0B --description 'Requires an owner decision' --force
          gh pr edit "$PR" --add-assignee "$OWNER" --add-label needs-owner-input
          gh pr comment "$PR" --body 'This update can contain a breaking change or unexpected files. Owner input is required.'
