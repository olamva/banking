name: Deploy

on:
  push:
    branches: [main]
    paths:
      - src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - vite.config.ts
      - infra/Dockerfile
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency: deploy

jobs:
  deploy:
    name: Build and deploy the image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/data"
          cp -R src "$stage/src"
          cp -R data/dist "$stage/data/dist"
          cp package.json pnpm-lock.yaml pnpm-workspace.yaml infra/Dockerfile "$stage"
          pnpm install --dir "$stage" --prod --node-linker=hoisted --frozen-lockfile --ignore-scripts
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      - env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - run: |
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" "$STAGE"
          docker push --all-tags "$IMAGE"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: |
          az containerapp update --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_APP }}" --image "$IMAGE:$GITHUB_SHA" --only-show-errors >/dev/null
