<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e30"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <!-- userSpaceOnUse: the bar has a zero-width box, and the default units
         make that gradient degenerate, so the bar paints nothing. -->
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="11" x2="0" y2="53">
      <stop offset="0" stop-color="#4dff44"/>
      <stop offset="1" stop-color="#2fe626"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g fill="none" stroke="url(#g)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 11 L32 53"/>
    <path d="M40 26 C40 21 24 21 24 27 C24 33 40 32.5 40 38.5 C40 44.5 24 44.5 24 39"/>
  </g>
</svg>
