<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <!-- Safari reads no SVG icon, and iOS reads none at all. -->
    <link rel="icon" type="image/png" sizes="180x180" href="./icon-180.png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <title>Spending dashboard</title>
    <script>
      // Before first paint, or the page flashes light and then corrects itself.
      var saved = localStorage.getItem("dashboardTheme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
